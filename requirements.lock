# Hash-verified dependency lock for the `etl`/`ingest` images: exact
# versions AND per-artifact sha256 hashes for every package
# pyproject.toml's [project.dependencies]/optional-dependencies floors
# (>=) resolve to. A pinned version alone (the old requirements.lock)
# only stops accidental drift; hashes also stop a same-version artifact
# substitution from installing silently.
#
# Generated inside a throwaway container (pip-compile is never added to
# the image itself, and never run on the host):
#
#   docker compose run --rm --entrypoint sh etl -c \
#     "pip install --quiet pip-tools && PATH=\$HOME/.local/bin:\$PATH \
#      pip-compile --generate-hashes --extra dev --extra geo \
#      --output-file - pyproject.toml" > requirements.lock
#
# Installed in --require-hashes mode, which needs `-r` (requirements),
# not `-c` (constraints) — the old constraints-file install
# (`pip install -c requirements.lock .[dev,geo] orjson`) cannot combine
# with --require-hashes:
#
#   pip install --require-hashes -r requirements.lock
#   pip install --no-deps .
#
# The second command installs the project itself without re-resolving —
# its own dependencies are already present and hash-verified from the
# first command, so nothing here needs to name `fly` or `orjson`
# separately.
#
# pyproject.toml keeps its `>=` floors — the abstract "what we depend
# on"; this file is the concrete "which versions, proven by which
# hashes." Two sources of truth for the same thing is how they drift
# apart, so don't also hard-pin versions in pyproject.toml.
#
# Regenerate and re-run the full `./run etl` acceptance check whenever a
# dependency needs to move — a version bump can change pipeline artifact
# bytes (scikit-learn 1.9.0 changed data/build/lookup/airports.pkl).
